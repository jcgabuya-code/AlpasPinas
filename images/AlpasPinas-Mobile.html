document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

16px; border-top: 1px solid {{ colors.border }};\">\n            <span style=\"font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #0EA5E9;\">The Open Seat<\u002Fspan>\n            <div style=\"font-family: 'Anton', sans-serif; font-size: 1.9rem; line-height: 1; color: {{ colors.text }};\">CLAIM YOUR SEAT<\u002Fdiv>\n            <div style=\"font-size: 0.92rem; line-height: 1.6; color: {{ colors.muted }};\">There's a seat in the boat with your name on it. Come try a session — no experience needed, all gear provided. We'll get you on the water within a week or two.<\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;\">\n              <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid {{ colors.border }}; padding: 8px 0;\"><span style=\"color: {{ colors.muted }};\">Training base<\u002Fspan><span style=\"color: {{ colors.text }}; font-weight: 600; text-align: right;\">Marina Putrajaya / Subang PARC<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid {{ colors.border }}; padding: 8px 0;\"><span style=\"color: {{ colors.muted }};\">Email<\u002Fspan><span style=\"color: {{ colors.text }}; font-weight: 600;\">admin@alpaspinas.com<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; padding: 8px 0;\"><span style=\"color: {{ colors.muted }};\">Instagram<\u002Fspan><span style=\"color: {{ colors.text }}; font-weight: 600;\">@alpaspinasdbt<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 6px;\">\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; font-weight: 700; color: {{ colors.muted }};\">Name\n                <input type=\"text\" placeholder=\"Your full name\" style=\"height: 46px; border-radi letter-spacing: 0.02em; box-shadow: 0 6px 18px rgba(14,165,233,0.28); cursor: pointer;\">Claim my seat →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <footer style=\"padding: 34px 22px 40px; background: {{ colors.bg }}; border-top: 1px solid {{ colors.border }}; display: flex; flex-direction: column; gap: 18px;\">\n            <div style=\"display: flex; align-items: center; gap: 8px;\">\n              <div style=\"width: 30px; height: 30px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: #fff;\">\n                <img src=\"ef516a83-c759-4e1f-b5f6-f00c756bcc81\" alt=\"AlpasPinas\" style=\"width: 145%; height: 145%; margin-left: -22%; margin-top: -22%; object-fit: cover; display: block;\">\n              <\u002Fdiv>\n              <span style=\"font-family: 'Anton', sans-serif; font-size: 1rem; color: {{ colors.text }};\">ALPAS<span style=\"color: #0EA5E9;\">PINAS<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size: 0.85rem; color: {{ colors.muted }}; line-height: 1.5;\">One stroke. One team. Filipino dragon boat crew based in Malaysia.<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px 18px;\">\n              <sc-for list=\"{{ footerLinks }}\" as=\"fl\" hint-placeholder-count=\"5\">\n                <a href=\"{{ fl.href }}\" onclick=\"{{ fl.onClick }}\" style=\"font-size: 0.82rem; font-weight: 600; color: {{ colors.text }}; text-decoration: none;\">{{ fl.label }}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size: 0.72rem; color: {{ colors.muted }}; padding-top: 14px; border-top: 1px solid {{ colors.border }};\">© 2026 AlpasPinas Dragonboat Team. admin@alpaspinas.com<\u002Fdiv>\n          <\u002Ffooter>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ drawerMounted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div key=\"{{ openKey }}\" style=\"position: absolute; inset: 0; z-index: 50; background: {{ colors.bg }}; display: flex; flex-direction: column; opacity: {{ drawerOpacity }}; transition: opacity 0.22s ease;\">\n\n          <div style=\"height: 46px; flex-shrink: 0;\"><\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 0 18px; height: 60px; border-bottom: 1px solid {{ colors.border }}; flex-shrink: 0;\">\n            <div style=\"display: flex; align-items: center; gap: 8px;\">\n              <div style=\"width: 32px; height: 32px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: #fff;\">\n                <img src=\"ef516a83-c759-4e1f-b5f6-f00c756bcc81\" alt=\"AlpasPinas\" style=\"width: 145%; height: 145%; margin-left: -22%; margin-top: -22%; object-fit: cover; display: block;\">\n              <\u002Fdiv>\n              <span style=\"font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.03em; color: {{ colors.text }};\">ALPAS<span style=\"color: #0EA5E9;\">PINAS<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <button aria-label=\"Close menu\" onclick=\"{{ toggleDrawer }}\" style=\"width: 38px; height: 38px; border-radius: 999px; border: 1px solid {{ colors.border }}; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ colors.text }}\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"flex: 1; overflow-y: auto; padding: 8px 26px 26px; display: flex; flex-direction: column;\">\n\n            <div style=\"display: flex; flex-direction: column; padding-top: 12px;\">\n              <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n                <a href=\"{{ item.href }}\" onclick=\"{{ item.onClick }}\" class=\"drawer-item-in\" style=\"animation-delay: {{ item.delay }}; display: flex; align-items: center; justify-content: space-between; padding: 13px 4px; text-decoration: none; border-bottom: 1px solid {{ colors.border }}; color: {{ item.active }}; font-family: 'Anton', sans-serif; font-size: 1.4rem; letter-spacing: 0.02em; cursor: pointer;\">\n                  <span>{{ item.label }}<\u002Fspan>\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div class=\"drawer-item-in\" style=\"animation-delay: 0.5s; display: flex; align-items: center; justify-content: space-between; padding: 20px 4px; margin-top: 4px; border-bottom: 1px solid {{ colors.border }};\">\n              <span style=\"font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{ colors.muted }};\">Appearance<\u002Fspan>\n              <div style=\"display: flex; align-items: center; gap: 10px;\">\n                <button aria-label=\"Switch color theme\" onclick=\"{{ noop }}\" style=\"background: transparent; border: 1px solid {{ colors.border }}; width: 32px; height: 32px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">\n                  <span style=\"width: 16px; height: 16px; border-radius: 999px; background: linear-gradient(135deg, #0369A1 0%, #0EA5E9 55%, #7DD3FC 100%);\"><\u002Fspan>\n                <\u002Fbutton>\n                <button aria-label=\"Toggle light or dark theme\" onclick=\"{{ toggleTheme }}\" style=\"background: transparent; color: {{ colors.text }}; border: 1px solid {{ colors.border }}; width: 32px; height: 32px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">\n                  <sc-if value=\"{{ dark }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3.6\"><\u002Fcircle><path d=\"M12 2.5v2.2\"><\u002Fpath><path d=\"M12 19.3v2.2\"><\u002Fpath><path d=\"M4.6 4.6l1.55 1.55\"><\u002Fpath><path d=\"M17.85 17.85l1.55 1.55\"><\u002Fpath><path d=\"M2.5 12h2.2\"><\u002Fpath><path d=\"M19.3 12h2.2\"><\u002Fpath><path d=\"M4.6 19.4l1.55-1.55\"><\u002Fpath><path d=\"M17.85 6.15l1.55-1.55\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ notDark }}\" hint-placeholder-val=\"{{ true }}\">\n                    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.5 13.2A8 8 0 1 1 10.8 3.5a6.2 6.2 0 0 0 9.7 9.7z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <a href=\"/login\" onclick=\"{{ toggleDrawer }}\" class=\"drawer-item-in\" style=\"animation-delay: 0.56s; padding: 16px 4px; text-decoration: none; color: {{ colors.text }}; font-weight: 600; font-size: 1rem; border-bottom: 1px solid {{ colors.border }};\">Login<\u002Fa>\n\n            <a href=\"/join-team\" onclick=\"{{ joinFromDrawer }}\" class=\"drawer-item-in\" style=\"animation-delay: 0.62s; margin-top: 20px; text-align: center; background: linear-gradient(135deg, #0369A1 0%, #0EA5E9 55%, #7DD3FC 100%); color: #fff; padding: 1rem 1.3rem; border-radius: 999px; font-weight: 700; font-size: 1rem; text-decoration: none; letter-spacing: 0.02em; box-shadow: 0 6px 18px rgba(14,165,233,0.28); cursor: pointer;\">Join the Team<\u002Fa>\n\n            <div class=\"drawer-item-in\" style=\"animation-delay: 0.68s; margin-top: auto; padding-top: 26px; font-size: 0.78rem; color: {{ colors.muted }}; text-align: center;\">One stroke. One team.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 920}}\">\nclass Component extends DCLogic {\n  scrollRef = React.createRef();\n  sectionRefs = {\n    home: React.createRef(),\n    about: React.createRef(),\n    training: React.createRef(),\n    gear: React.createRef(),\n    races: React.createRef(),\n    join: React.createRef(),\n  };\n\n  state = {\n    open: false,\n    dark: false,\n    openKey: 0,\n    drawerMounted: false,\n    drawerOpacity: 0,\n  };\n\n  scrollTo = (key) => {\n    const el = this.sectionRefs[key] && this.sectionRefs[key].current;\n    const container = this.scrollRef.current;\n    if (!el || !container) return;\n    const top = Math.max(0, el.offsetTop - 10);\n    container.scrollTo({ top, behavior: 'smooth' });\n  };\n\n  toggleDrawer = () => {\n    if (this.state.open) {\n      this.setState({ open: false, drawerOpacity: 0 });\n      setTimeout(() => this.setState({ drawerMounted: false }), 220);\n    } else {\n      this.setState(s => ({ open: true, drawerMounted: true, openKey: s.openKey + 1, drawerOpacity: 1 }));\n    }\n  };\n\n  navigateAndClose = (key) => (e) => {\n    e.preventDefault();\n    this.toggleDrawer();\n    setTimeout(() => this.scrollTo(key), 260);\n  };\n\n  toggleTheme = () => {\n    this.setState(s => ({ dark: !s.dark }));\n  };\n\n  noop = () => {};\n\n  renderVals() {\n    const dark = this.state.dark;\n\n    const colors = dark\n      ? { bg: 'rgb(10, 16, 24)', altBg: 'rgb(15, 22, 34)', text: 'rgb(245, 247, 251)', muted: 'rgb(154, 166, 189)', border: 'rgb(36, 50, 74)' }\n      : { bg: 'rgb(248, 243, 227)', altBg: 'rgb(255, 252, 241)', text: 'rgb(10, 16, 24)', muted: 'rgb(88, 100, 120)', border: 'rgb(228, 218, 192)' };\n\n    const navColors = {\n      bg: dark ? 'rgba(10,16,24,0.85)' : 'rgba(248,243,227,0.85)',\n      border: colors.border,\n      blur: 'blur(10px)',\n    };\n\n    const pageColors = {\n      pageBg: dark ? '#05070a' : '#eef0f4',\n      pageMuted: dark ? 'rgba(245,247,251,0.5)' : 'rgba(10,16,24,0.45)',\n    };\n\n    const ph = {\n      bg: colors.altBg,\n      stripes: dark\n        ? `repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 10px, transparent 10px 20px)`\n        : `repeating-linear-gradient(135deg, rgba(10,16,24,0.05) 0 10px, transparent 10px 20px)`,\n      labelColor: colors.muted,\n    };\n\n    const sectionOrder = ['home', 'about', 'training', 'gear', 'races', 'join'];\n    const pillLabels = { home: 'Home', about: 'Story', training: 'Training', gear: 'Gear', races: 'Races', join: 'Join' };\n    const pillItems = sectionOrder.map(key => ({ key, label: pillLabels[key], onClick: () => this.scrollTo(key) }));\n\n    const navLabels = [\n      { key: 'home', label: 'Home' },\n      { key: 'about', label: 'About' },\n      { key: 'training', label: 'Training' },\n      { key: 'gear', label: 'Merch' },\n      { key: 'races', label: 'Races' },\n      { key: 'join', label: 'Join Us' },\n    ];\n    const navItems = navLabels.map((n, i) => ({\n      ...n,\n      href: '#' + n.key,\n      active: i === 0 ? 'rgb(14, 165, 233)' : colors.text,\n      delay: `${0.1 + i * 0.05}s`,\n      onClick: this.navigateAndClose(n.key),\n    }));\n\n    const tags = [\n      'BEGINNER FRIENDLY', 'WEEKEND WATER SESSIONS', 'ALL GEAR PROVIDED',\n      'PUTRAJAYA + SUBANG PARC', 'RACE DAYS + CREW SOCIALS', 'FILIPINO CREW IN MALAYSIA',\n    ];\n\n    const res = (window.__resources || {});\n    const products = [\n      { name: 'AlpasPinas Drifit Shirt (Unisex)', price: 'RM 75', oldPrice: 'RM 90', badge: 'LIMITED DROP', photo: res.productShirt || 'product-shirt.jpg' },\n      { name: 'AlpasPinas Race Jersey (Unisex)', price: 'RM 90', oldPrice: null, badge: null, photo: res.productJersey || 'product-jersey.jpg' },\n      { name: 'AlpasPinas Racerback Tank Top', price: 'RM 80', oldPrice: null, badge: null, photo: res.productTank || 'product-tank.jpg' },\n      { name: 'Racerback Tank – White Edition', price: 'RM 80', oldPrice: null, badge: null, photo: res.productTankWhite || 'product-tank-white.jpg' },\n    ];\n\n    const races = [\n      { year: '2025', event: 'Boracay International Dragon Boat Festival', category: 'Mixed 500m', time: '2:14.32', place: 'Bronze', badgeBg: 'rgba(202,138,4,0.16)', badgeColor: dark ? 'rgb(250,204,21)' : 'rgb(146,64,14)' },\n      { year: '2024', event: 'Manila Bay Heritage Cup', category: 'Open 200m Sprint', time: '0:48.91', place: 'Silver', badgeBg: dark ? 'rgba(203,213,225,0.16)' : 'rgba(100,116,139,0.14)', badgeColor: colors.muted },\n      { year: '2024', event: 'Iloilo River Regatta', category: 'Mixed 500m', time: '2:18.04', place: '5th', badgeBg: 'transparent', badgeColor: colors.muted },\n      { year: '2024', event: 'Putrajaya International Dragon Boat Festival', category: 'Mixed Standard 500m', time: '2:21.55', place: '7th', badgeBg: 'transparent', badgeColor: colors.muted },\n    ];\n\n    const footerLinks = [\n      { label: 'About', href: '#about', onClick: (e) => { e.preventDefault(); this.scrollTo('about'); } },\n      { label: 'Training', href: '#training', onClick: (e) => { e.preventDefault(); this.scrollTo('training'); } },\n      { label: 'Gallery', href: '#', onClick: this.noop },\n      { label: 'Merch', href: '#gear', onClick: (e) => { e.preventDefault(); this.scrollTo('gear'); } },\n      { label: 'Join', href: '#join', onClick: (e) => { e.preventDefault(); this.scrollTo('join'); } },\n    ];\n\n    const open = this.state.open;\n    const bar1 = open\n      ? { top: '5.5px', transform: 'rotate(45deg)' }\n      : { top: '0px', transform: 'rotate(0deg)' };\n    const bar3 = open\n      ? { top: '5.5px', transform: 'rotate(-45deg)' }\n      : { top: '11px', transform: 'rotate(0deg)' };\n\n    return {\n      colors,\n      navColors,\n      pageColors,\n      ph,\n      pillItems,\n      navItems,\n      tags,\n      products,\n      races,\n      footerLinks,\n      dark,\n      notDark: !dark,\n      open,\n      drawerMounted: this.state.drawerMounted,\n      drawerOpacity: this.state.drawerOpacity,\n      openKey: this.state.openKey,\n      bar1,\n      bar3,\n      bar2Opacity: open ? 0 : 1,\n      hamburgerLabel: open ? 'Close menu' : 'Open menu',\n      toggleDrawer: this.toggleDrawer,\n      toggleTheme: this.toggleTheme,\n      joinFromDrawer: this.navigateAndClose('join'),\n      scrollToJoin: () => this.scrollTo('join'),\n      scrollTo: this.scrollTo,\n      scrollRef: this.scrollRef,\n      sectionRefs: this.sectionRefs,\n      noop: this.noop,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
